<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="src/style.css" />
        <link rel="shortcut icon" href="//uiowa.edu/profiles/custom/sitenow/assets/favicon.ico">
        <title>stream-sensor-network-administration-map</title>
    </head>
    <body>
        <div id="main-view">
            <div id="app-body">
                <div id="sidebar" class="collapsed">
                    <div class="sidebar-content">
                        <div class="sidebar-section">
                            <label for="search-input"></label>
                            <input type="search" id="search-input" placeholder="Search...">
                        </div>

                        <div class="sidebar-section">
                            <label class="sidebar-heading">Filters</label>
                            <div id="filter-groups"></div>
                        </div>
                    </div>
                </div>

                <div id="map">
                    <span id="sidebar-toggle" class="icon-group-item sidebar-toggle" title="Filter">
                        <img src="/src/assets/icons/filter.png" alt="Filter">
                    </span>
                    <div class="icon-group popup-control">
                        <label class="icon-group-item" title="Plots">
                            <input type="checkbox" name="plots">
                            <img src="/src/assets/icons/plot.svg" alt="Plots">
                        </label>

                        <label class="icon-group-item" title="Street View">
                            <input type="checkbox" name="panorama">
                            <img src="/src/assets/icons/360.svg" alt="360">
                        </label>
                    </div>

                    <div class="icon-group color-control">
                        <label class="icon-group-item" title="Voltage">
                            <input type="checkbox" name="markers-colorBy" data-colorBy="voltage">
                            <img src="/src/assets/icons/battery.svg" alt="Voltage"/>
                        </label>

                        <label class="icon-group-item" title="Firmware">
                            <input type="checkbox" name="markers-colorBy" data-colorBy="firmware_version">
                            <img src="/src/assets/icons/firmware.svg" alt="Firmware"/>
                        </label>

                        <label class="icon-group-item" title="Activity">
                            <input type="checkbox" name="markers-colorBy" data-colorBy="no_packet_days">
                            <img src="/src/assets/icons/packet.svg" alt="No packet days"/>
                        </label>
                    </div>

                    <div class="map-style-control">
                        <span class="icon-group-item map-style-toggle" title="Map Style">
                            <img src="/src/assets/icons/map.svg" alt="Plots">
                        </span>
                        <div class="map-style-menu">
                            <div class="map-style-option" data-style="standard">Standard</div>
                            <div class="map-style-option" data-style="satellite">Satellite</div>
                            <div class="map-style-option" data-style="light">Light</div>
                            <div class="map-style-option" data-style="dark">Dark</div>
                        </div>
                    </div>

                    <div id="legend"></div>

                    <div id="plot-container" class="draggable">
                        <span class="close-button">✕</span>
                        <div class="toggle-container"></div>
                        <div class="plotly-body"></div>
                    </div>

                    <div id="pano-container" class="draggable hidden">
                        <span class="close-button">✕</span>
                        <div id="pano"></div>
                    </div>

                    <div id="renderObservatoryContainer" class="draggable hidden">
                        <span class="close-button">✕</span>
                    </div>

                    <div id="login-container" class="pop-up-container draggable hidden">
                        <form id="login-form">
                            <h2>Login</h2>
                            <label for="login-email"></label><input type="email" id="login-email" placeholder="Email" required />
                            <label for="login-password"></label><input type="password" id="login-password" placeholder="Password" required />
                            <button type="submit" class="btn submit-btn login-btn">Login</button>
                            <span id="forgot-password-link" class="link">Forgot password?</span>
                        </form>
                    </div>

                    <div id="forgot-password-container" class="pop-up-container draggable hidden">
                        <div id="forgot-password-form">
                            <h2>Reset Password</h2>
                            <label for="forgot-email"></label><input type="email" id="forgot-email" placeholder="Email" required />
                            <button type="button" id="get-otp-btn" class="btn submit-btn login-btn">Get One-Time Code</button>
                            <span class="link back-to-login">Back to login</span>
                        </div>
                    </div>

                    <div id="new-password-container" class="pop-up-container draggable hidden">
                        <div id="new-password-form">
                            <h2>Reset Password</h2>
                            <label for="reset-email"></label><input type="email" id="reset-email" placeholder="Email" autocomplete="off" required />
                            <label for="reset-otp"></label><input type="text" id="reset-otp" placeholder="One-Time Code" autocomplete="one-time-code" required />
                            <label for="reset-password"></label><input type="password" id="reset-password" placeholder="New Password" autocomplete="new-password" required />
                            <label for="reset-password-confirm"></label><input type="password" id="reset-password-confirm" placeholder="Confirm New Password" autocomplete="new-password" required />
                            <button type="button" id="reset-password-btn" class="btn submit-btn login-btn">Reset Password</button>
                            <span class="link back-to-login">Back to login</span>
                        </div>
                    </div>

                    <div id="createTicket" class="modal pop-up-container draggable hidden">
                        <div class="modal-header">
                            <span class="modal-title">Create Ticket</span>
                            <span class="close-button">X</span>
                        </div>
                        <div class="modal-body">
                            <div class="modal-row">
                                <label class="modal-label">Bridge<input name="observatory" class="modal-input" type="text"></label>
                            </div>
                            <div class="modal-row">
                                <label class="modal-label">Problem<textarea name="problem" class="modal-input"></textarea></label>
                            </div>
                            <div class="modal-row">
                                <label class="modal-label">Assigned to <select name="assignee" class="modal-input" data-prefill="maintenanceCrew"><option value="James Niemeier">James Niemeier</option><option value="Weber, Larry J">Weber, Larry J</option><option value="Lyons, Troy">Lyons, Troy</option><option value="Alan Doran">Alan Doran</option><option value="Radek GoSKA">Radek GoSKA</option></select></label>
                                <label class="modal-label">Status <select name="status" class="modal-input" data-mode="edit" data-prefill="ticketStatus"><option value="assigned">assigned</option><option value="suspended">suspended</option><option value="done">done</option></select></label>
                            </div>
                            <div class="modal-row">
                                <label class="modal-label">Notes <input name="notes" class="modal-input" type="text"></label>
                            </div>
                            <div class="modal-actions">
                                <!-- Existing buttons (visible when NOT confirming) -->
                                <button class="secondary reset-btn">Reset</button>
                                <button class="primary submit-btn" disabled="">Save</button>

                                <!-- Confirm buttons (visible only when confirming) -->
                                <button class="secondary cancel-btn">Cancel</button>
                                <button class="primary approve-btn">Approve</button>
                            </div>
                        </div>
                    </div>

                    <div id="viewTickets" class="pop-up-container draggable hidden">
                        <span class="close-button">✕</span>
                    </div>

                    <div id="editTicket" class="pop-up-container modal draggable hidden">
                        <div class="modal-header">
                            <span class="modal-title">Edit Ticket</span>
                            <span class="close-button">X</span>
                        </div>
                        <div class="modal-body">
                            <div class="modal-row">
                                <label class="modal-label">Bridge<input name="observatory" class="modal-input" type="text"></label>
                            </div>
                            <div class="modal-row">
                                <label class="modal-label">Problem<textarea name="problem" class="modal-input"></textarea></label>
                            </div>
                            <div class="modal-row">
                                <label class="modal-label">Assigned to <select name="assignee" class="modal-input" data-prefill="maintenanceCrew"><option value="James Niemeier">James Niemeier</option><option value="Weber, Larry J">Weber, Larry J</option><option value="Lyons, Troy">Lyons, Troy</option><option value="Alan Doran">Alan Doran</option><option value="Radek GoSKA">Radek GoSKA</option></select></label>
                                <label class="modal-label">Status <select name="status" class="modal-input" data-mode="edit" data-prefill="ticketStatus"><option value="assigned">assigned</option><option value="suspended">suspended</option><option value="done">done</option></select></label>
                            </div>
                            <div class="modal-row">
                                <label class="modal-label">Notes <input name="notes" class="modal-input" type="text"></label>
                            </div>
                        </div>
                        <div class="modal-actions">
                            <!-- Existing buttons (visible when NOT confirming) -->
                            <button class="secondary reset-btn">Reset</button>
                            <button class="primary submit-btn" disabled="">Save</button>

                            <!-- Confirm buttons (visible only when confirming) -->
                            <button class="secondary cancel-btn">Cancel</button>
                            <button class="primary approve-btn">Approve</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
